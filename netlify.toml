# Netlify Production Configuration for BuyWise (React + Vite SPA)

[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) routing fallback
# Ensures direct navigation to /category/*, /review/*, /guides/*, etc. does not 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets with long max-age (hashed filenames in dist/assets)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
